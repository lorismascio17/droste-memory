name: Publish MCP Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check PyPI/server release alignment
        id: release_alignment
        run: python scripts/check_release_alignment.py --github-output

      - name: Skip publish when release is not aligned
        if: steps.release_alignment.outputs.aligned != 'true'
        run: echo "PyPI, pyproject.toml and server.json are not aligned yet. Skipping MCP Registry publish."

      - name: Install mcp-publisher
        if: steps.release_alignment.outputs.aligned == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        if: steps.release_alignment.outputs.aligned == 'true'
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        if: steps.release_alignment.outputs.aligned == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.release_alignment.outputs.aligned == 'true'
        run: |
          # Idempotent: the daily cron re-runs even when nothing changed, and
          # the registry rejects a version it already has. Treat that specific
          # "duplicate version" 400 as a no-op success, so only a genuinely new
          # release publishes and real errors still fail the job.
          set +e
          output="$(./mcp-publisher publish 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qi "duplicate version"; then
              echo "Version already present in the MCP Registry — nothing to publish."
              exit 0
            fi
            exit "$status"
          fi
