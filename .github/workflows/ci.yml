name: ci

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

env:
  DROSTE_EMBEDDING_BACKEND: hash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q --junitxml=.pytest-results.xml
      - name: Report pytest failures
        if: failure()
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path(".pytest-results.xml")
          if not report.exists():
              print("::error::pytest did not produce .pytest-results.xml")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              message = problem.get("message") or problem.text or "pytest failure"
              message = " ".join(message.split())[:900]
              name = f"{case.get('classname', 'pytest')}.{case.get('name', 'unknown')}"
              print(f"::error::{name}: {message}")

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_artifacts.py
      - name: Install wheel and exercise CLI, viewer and MCP
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -I scripts/smoke_install.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
